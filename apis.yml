aid: scalable-capital
name: Scalable Capital
description: >-
  Scalable Capital is a Munich-based digital investment platform and licensed
  bank operating across Germany, Austria, Italy, France, Spain and the
  Netherlands. It offers a self-directed neobroker for trading stocks, ETFs,
  bonds, funds, crypto and derivatives, automated Wealth (robo-advisory)
  portfolio management, ETF and stock savings plans, an interest-bearing
  overnight cash account, and credit services. Backed by Balderton Capital and
  HV Capital, Scalable Capital serves retail investors through consumer web and
  mobile applications; it does not currently publish a public developer API,
  developer portal, or OpenAPI specification. This profile was added to the API
  Evangelist network as a portfolio-lead stub and enriched via public-surface
  probes.
